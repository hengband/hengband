name: Pull Request Status Check

on:
  # プルリクエストがopen、synchronize、reopenされた時にトリガーする
  pull_request:

  # 手動トリガーを許可
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_bom:
    name: Check the BOM of the source files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sh ./.github/scripts/check-bom.sh

  check_newline:
    name: Check the newline of files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sh ./.github/scripts/check-newline.sh

  check_format:
    name: Check the format of the source files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the format of the cpp source and header files
        run: sh ./.github/scripts/check-cpp-format.sh
      - name: Check the format of the json/jsonc files
        run: sh ./.github/scripts/check-json-format.sh

  check_include_style:
    name: Check include directive style ("" vs <>)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 .github/scripts/check-include-style.py

  check_test_registration:
    name: Check the registration of the unit test sources (Makefile.am / HengbandTest.vcxproj)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sh ./.github/scripts/check-test-registration.sh

  build_test_clang_libcpp_without_pch:
    name: Build Japanese version with clang 21 -stdlib=libc++ (without using pre-compiled headers, with XFT)
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: ubuntu-26.04
      cxx: clang++-21
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra -stdlib=libc++"
      configure-opts: "--disable-pch --enable-xft"
      use-ccache: true

  build_test_clang_without_pch:
    name: Build Japanese version with clang 21 (without using pre-compiled headers, with XFT)
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: ubuntu-26.04
      cxx: clang++-21
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra"
      configure-opts: "--disable-pch --enable-xft"
      use-ccache: true

  build_test_clang_with_pch_english:
    name: Build English version with clang 21 (with using pre-compiled headers, without XFT)
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: ubuntu-26.04
      cxx: clang++-21
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra"
      configure-opts: "--disable-japanese --disable-assert"
      use-ccache: true

  build_test_gcc_japanese:
    name: Build Japanese version with gcc 16 (with XFT)
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: ubuntu-26.04
      cxx: g++-16
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra"
      configure-opts: "--disable-pch --enable-xft"
      use-ccache: true

  build_test_gcc_english:
    name: Build English version with gcc 16 (without XFT)
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: ubuntu-26.04
      cxx: g++-16
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra"
      configure-opts: "--disable-pch --disable-japanese --disable-assert"
      distcheck: true
      use-ccache: true

  build_test_apple_clang_japanese:
    name: Build Japanese version with Apple Clang 21 (without X11)
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: macos-26
      cxx: clang++
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra"
      configure-opts: "--disable-pch --without-x"
      use-ccache: true

  build_test_apple_clang_english:
    name: Build English version with Apple Clang 21 (without X11)
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: macos-26
      cxx: clang++
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra"
      configure-opts: "--disable-pch --disable-japanese --without-x"
      distcheck: true
      use-ccache: true

  build_test_with_msvc:
    name: Build and test with MSVC
    uses: ./.github/workflows/build-test-with-msvc.yml

  json-schema-validation:
    name: JSON Schema Validation (lib/edit + schema)
    runs-on: ubuntu-24.04
    steps:
      - name: Repository checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Installation dependencies with trailing comma
        run: |
          python -m pip install --upgrade pip
          pip install pyjson5 jsonschema

      - name: Execution JSONC schema validation
        run: python .github/scripts/validate_json.py

      - name: Test JSONC validation
        run: python -m unittest discover -s .github/scripts -p 'test_validate_json.py'

      - name: Result summary
        if: always()
        run: echo "Hengband JSON validation completed."
