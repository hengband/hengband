name: Create Release

on:
  push:
    branches:
      - master
  # 手動トリガーを許可
  workflow_dispatch:


jobs:
  build-release-package:
    name: Build Windows Release Package
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Extract version from configure.ac
        id: get_version
        run: |
          $version = Select-String -Path configure.ac -Pattern 'AC_INIT\(hengband, (.+?)\)' | ForEach-Object { $_.Matches.Groups[1].Value }
          echo "version=$version" >> $Env:GITHUB_OUTPUT

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build Windows Release Package
        run: |
          .\tools\release\Build-Windows-Release-Package.ps1 -Version ${{ steps.get_version.outputs.version }}

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-package
          path: Hengband-*.zip
          if-no-files-found: error
          overwrite: true

  # Linux 向けの AppImage と Flatpak (日本語版・英語版)
  build-linux-packages:
    name: Build Linux Packages
    permissions:
      contents: read
    uses: ./.github/workflows/build-linux-packages.yml
    with:
      upload: true

  publish-release-page:
    name: Publish Release Page
    needs: [build-release-package, build-linux-packages]
    # Linux 向けのパッケージのビルドに失敗しても、Windows 版だけでリリースの下書きを作る
    if: ${{ !cancelled() && needs.build-release-package.result == 'success' }}
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    steps:
      - name: Download release package
        uses: actions/download-artifact@v8
        with:
          name: windows-release-package
          path: .

      - name: Download Linux packages
        if: ${{ needs.build-linux-packages.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: .
          merge-multiple: true

      # 載せるファイルを決める。Linux 向けは、ビルドに成功したときだけ載せる
      - id: files
        name: Decide release files
        shell: bash
        env:
          LINUX_RESULT: ${{ needs.build-linux-packages.result }}
        run: |
          {
            echo 'list<<EOF'
            echo 'Hengband-*.zip'
            if [ "$LINUX_RESULT" = success ]; then
              echo 'Hengband-*.AppImage'
              echo 'Hengband-*.flatpak'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ "$LINUX_RESULT" != success ]; then
            echo "::warning::Linux packages were not built (result: $LINUX_RESULT), so they are not attached to the release."
          fi

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.files.outputs.list }}
          fail_on_unmatched_files: true
          name: ${{ needs.build-release-package.outputs.version }}
          tag_name: ${{ needs.build-release-package.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: true
