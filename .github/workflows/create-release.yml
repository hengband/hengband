name: Create Release

on:
  push:
    branches:
      - master
  # 手動トリガーを許可
  workflow_dispatch:


jobs:
  build-release-package:
    name: Build Windows Release Package
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Extract version from configure.ac
        id: get_version
        run: |
          $version = Select-String -Path configure.ac -Pattern 'AC_INIT\(hengband, (.+?)\)' | ForEach-Object { $_.Matches.Groups[1].Value }
          echo "version=$version" >> $Env:GITHUB_OUTPUT

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4

      - name: Restore Nuget Packages
        run: |
          NuGet restore .\VisualStudio\Hengband.sln

      - name: Build Windows Release Package
        run: |
          .\Build-Windows-Release-Package.ps1 -Version ${{ steps.get_version.outputs.version }}

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-package
          path: Hengband-*.zip
          if-no-files-found: error
          overwrite: true

  publish-release-page:
    name: Publish Release Page
    needs: build-release-package
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    steps:
      - name: Download release package
        uses: actions/download-artifact@v8
        with:
          name: windows-release-package
          path: .

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: Hengband-*.zip
          fail_on_unmatched_files: true
          name: ${{ needs.build-release-package.outputs.version }}
          tag_name: ${{ needs.build-release-package.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: true
