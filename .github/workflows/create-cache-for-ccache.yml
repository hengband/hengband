name: Create Cache for ccache

on:
  push:
    branches:
      - develop

  # 手動トリガーを許可
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang_libcpp_without_pch_japanese:
    name: Japanese version with clang 21 -stdlib=libc++ (without using pre-compiled headers)
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: ubuntu-26.04
      cxx: clang++-21
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra -stdlib=libc++"
      configure-opts: "--disable-pch"
      use-ccache: true

  clang_without_pch:
    name: Japanese version with clang 21 (without using pre-compiled headers)
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: ubuntu-26.04
      cxx: clang++-21
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra"
      configure-opts: "--disable-pch"
      use-ccache: true

  gcc_japanese:
    name: Japanese version with gcc 16
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: ubuntu-26.04
      cxx: g++-16
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra"
      configure-opts: "--disable-pch"
      use-ccache: true

  gcc_english:
    name: English version with gcc 16
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: ubuntu-26.04
      cxx: g++-16
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra"
      configure-opts: "--disable-pch --disable-japanese"
      distcheck: true
      use-ccache: true

  apple_clang_japanese:
    name: Japanese version with Apple Clang 21
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: macos-26
      cxx: clang++
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra"
      configure-opts: "--disable-pch"
      use-ccache: true

  apple_clang_english:
    name: English version with Apple Clang 21
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: macos-26
      cxx: clang++
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra"
      configure-opts: "--disable-pch --disable-japanese"
      distcheck: true
      use-ccache: true
