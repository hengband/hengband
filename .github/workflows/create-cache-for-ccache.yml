name: Create Cache for ccache

on:
  push:
    branches:
      - develop

  # 手動トリガーを許可
  workflow_dispatch:

permissions:
  contents: read

# develop のキャッシュは PR の土台になるので、ccache のミスが 1 件でもあれば保存する
jobs:
  clang_libcpp_without_pch_japanese:
    name: Japanese version with clang 21 -stdlib=libc++ (without using pre-compiled headers, with XFT)
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: ubuntu-26.04
      cxx: clang++-21
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra -stdlib=libc++"
      configure-opts: "--disable-pch --enable-xft"
      use-ccache: true
      ccache-save-min-misses: 1

  clang_without_pch_japanese:
    name: Japanese version with clang 21 (without using pre-compiled headers, with XFT, without networking)
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: ubuntu-26.04
      cxx: clang++-21
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra"
      configure-opts: "--disable-pch --enable-xft --disable-net"
      use-ccache: true
      ccache-save-min-misses: 1

  clang_with_pch_english:
    name: English version with clang 21 (with using pre-compiled headers, without XFT)
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: ubuntu-26.04
      cxx: clang++-21
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra"
      configure-opts: "--disable-japanese --disable-assert"
      use-ccache: true
      ccache-save-min-misses: 1

  gcc_japanese:
    name: Japanese version with gcc 16 (with using pre-compiled headers, with XFT)
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: ubuntu-26.04
      cxx: g++-16
      # gcc は使えないプリコンパイル済みヘッダを黙って無視するので、警告 (エラー) にして使われていることを確かめる
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra -Winvalid-pch"
      configure-opts: "--enable-xft"
      use-ccache: true
      ccache-save-min-misses: 1

  gcc_english:
    name: English version with gcc 16 (without using pre-compiled headers, without XFT)
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: ubuntu-26.04
      cxx: g++-16
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra"
      configure-opts: "--disable-pch --disable-japanese --disable-assert"
      distcheck: true
      use-ccache: true
      ccache-save-min-misses: 1

  apple_clang_japanese:
    name: Japanese version with Apple Clang 21 (without X11)
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: macos-26
      cxx: clang++
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra"
      configure-opts: "--disable-pch --without-x"
      use-ccache: true
      ccache-save-min-misses: 1

  apple_clang_english:
    name: English version with Apple Clang 21 (without X11)
    uses: ./.github/workflows/build-with-autotools.yml
    with:
      runner: macos-26
      cxx: clang++
      cxx-flags: "-pipe -O3 -Werror -Wall -Wextra"
      configure-opts: "--disable-pch --disable-japanese --without-x"
      distcheck: true
      use-ccache: true
      ccache-save-min-misses: 1
