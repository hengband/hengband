name: Build and test with MSVC
on:
  workflow_call:

  # 手動トリガーを許可
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        # 日英と Debug / Release を互い違いに組み合わせる。日本語版は配布する Release を試す
        configuration:
          - Release
          - English-Debug

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Run build test
        run: |
          MSBuild -warnAsError .\VisualStudio\Hengband.sln /t:Rebuild /p:Configuration=${{ matrix.configuration }} /p:Platform=Win32

      # 上のビルドで HengbandTest プロジェクトも生成される。
      # doctest はテストが失敗すると非ゼロの終了コードを返す
      - name: Run unit tests
        run: |
          .\VisualStudio\Hengband\${{ matrix.configuration }}\hengband-test.exe
