<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  AppImage 用の fontconfig の設定。ホストの設定を読み込み、AppImage に同梱したフォントのディレクトリを足す。
  build-appimage.sh が usr/share/hengband/fonts.conf に置き、起動スクリプトが FONTCONFIG_FILE で渡す。
  prefix="relative" は、このファイルのあるディレクトリからの相対パス (fontconfig 2.13 以降)。
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">../fonts</dir>
</fontconfig>
